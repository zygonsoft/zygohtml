<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – ZYGOBASE</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow-bg: #fef3c7;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --green-600: #16a34a;
      --radius: 16px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--yellow-bg); color: var(--slate-800); min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--slate-200);
    }
    nav {
      max-width: 1280px; margin: 0 auto;
      padding: 12px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .nav-logo {
      height: 32px; width: 32px; border-radius: 10px;
      background: var(--slate-900); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 16px;
    }
    .nav-name { font-weight: 600; letter-spacing: -0.02em; color: var(--slate-900); }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { text-decoration: none; font-size: 14px; color: var(--slate-700); transition: color .2s; }
    .nav-links a:hover { color: var(--slate-900); }
    .nav-links .active { color: var(--slate-900); font-weight: 600; }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--slate-900); color: #fff;
      padding: 8px 18px; border-radius: var(--radius);
      font-size: 14px; font-weight: 500; text-decoration: none; transition: background .2s;
    }
    .nav-cta:hover { background: var(--slate-800); }
    .nav-cta svg { width: 16px; height: 16px; }
    @media (max-width: 768px) { .nav-links { display: none; } }

    main {
      min-height: calc(100vh - 57px);
      padding: 48px 0;
    }
    .contact-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    .contact-lead { margin-bottom: 40px; font-size: 14px; color: var(--slate-800); }

    .contact-layout {
      display: grid; grid-template-columns: 2fr 1fr; gap: 40px;
    }
    @media (max-width: 900px) { .contact-layout { grid-template-columns: 1fr; } }

    /* FORM */
    .form-card {
      background: var(--slate-50); border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 32px;
    }
    .form-group { margin-bottom: 24px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--slate-800); margin-bottom: 8px; }
    input, textarea {
      width: 100%; border: 1px solid var(--slate-200);
      border-radius: 12px; padding: 12px 16px;
      font-family: inherit; font-size: 14px; color: var(--slate-800);
      background: #fff; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--slate-500); }
    input::placeholder, textarea::placeholder { color: var(--slate-400); }
    textarea { height: 160px; resize: vertical; }
    .submit-btn {
      width: 100%; background: var(--slate-900); color: #fff;
      border: none; border-radius: 999px;
      padding: 16px; font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--slate-800); }
    .submit-btn:disabled { opacity: .7; cursor: not-allowed; }
    .success-msg {
      display: none; color: var(--green-600); font-size: 14px; font-weight: 500;
      margin-top: 16px;
    }
    .success-msg.show { display: block; }

    /* INFO CARD */
    .info-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 32px; height: fit-content;
    }
    .info-card h2 { font-size: 22px; font-weight: 700; color: var(--slate-900); margin-bottom: 24px; }
    .info-card p { font-size: 14px; color: var(--slate-700); line-height: 1.7; }
    .info-card a { color: var(--slate-900); }

    footer {
      padding: 40px 0; background: #fff;
      border-top: 1px solid var(--slate-200); margin-top: 0;
    }
    .footer-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 32px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .footer-copy { font-size: 14px; color: var(--slate-600); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-size: 14px; color: var(--slate-600); text-decoration: none; transition: color .2s; }
    .footer-links a:hover { color: var(--slate-900); }
  </style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="nav-brand">
      <div class="nav-logo">Z</div>
      <span class="nav-name">ZYGOBASE</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <a href="contact.html" class="nav-cta">
      Get a Quote
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </nav>
</header>

<main>
  <section class="contact-inner">
    <div class="contact-lead">
      Describe your technology stack and goals—our consultants will respond promptly.
    </div>

    <div class="contact-layout">
      <!-- FORM -->
      <div class="form-card">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name"/>
        </div>

        <div class="form-row">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@company.com"/>
          </div>
          <div>
            <label for="phone">Phone / WhatsApp</label>
            <input type="tel" id="phone" name="phone" placeholder="+91-XXXXXXXXXX"/>
          </div>
        </div>

        <div class="form-group">
          <label for="stack">Your Database Stack</label>
          <input type="text" id="stack" name="stack" placeholder="Oracle, SQL Server, PostgreSQL..."/>
        </div>

        <div class="form-group">
          <label for="message">What do you need help with?</label>
          <textarea id="message" name="message" placeholder="Monitoring, HA/DR, performance..."></textarea>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">Send Inquiry</button>
        <p class="success-msg" id="successMsg">✓ Message sent successfully!</p>
      </div>

      <!-- INFO CARD -->
      <div class="info-card">
        <h2>ZYGOBASE</h2>
        <p>
          <strong>Website:</strong>{' '}
          <a href="https://www.zygobase.com" target="_blank" rel="noopener">www.zygobase.com</a>
        </p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-copy">© 2025 Zycube. All rights reserved.</span>
    <div class="footer-links">
      <a href="services.html">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script>
  function handleSubmit() {
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('successMsg');

    // Basic validation
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    if (!name || !email) {
      alert('Please fill in your name and email.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    // Simulate send (replace with real fetch('/api/contact', ...) if backend available)
    setTimeout(() => {
      btn.textContent = 'Send Inquiry';
      btn.disabled = false;
      msg.classList.add('show');

      // Clear form
      ['name','email','phone','stack','message'].forEach(id => {
        document.getElementById(id).value = '';
      });

      setTimeout(() => msg.classList.remove('show'), 5000);
    }, 1200);
  }
</script>

</body>
</html>
